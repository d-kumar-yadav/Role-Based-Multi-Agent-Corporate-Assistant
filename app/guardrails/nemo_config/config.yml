  - type: embeddings
    engine: SentenceTransformers
    model: /app/all-MiniLM-L6-v2

rails:
  dialog:
    user_messages:
      embeddings_only: True
    flows:
      - greeting
      - help
      - goodbye








##################-############################
# FLOW OF A MESSAGE IN OUR AI SYSTEM
# Here is the step-by-step flow of what happens under the hood:

# 1. The User Sends a Message
# The user sends: "how to make coffie" to your FastAPI endpoint. 
# The script hands this message to `run_input_guardrails` in `input_checks.py`.

# 2. The PII Check (The Fast Filter)
# Before anything else, the script runs `detect_pii`. 
# It checks for obvious credit card numbers or social security numbers. 
# It finds nothing, so the message moves to the next step.

# 3. The Custom Python Firewall (The Smart Security Check)
# The script takes the user's message and wraps it in our strict security prompt.
# It sends this directly to the Groq LLM (Llama-3).
# It asks Groq: "Does 'how to make coffie' violate our Jailbreak, Toxic, or Off-Topic policies?"
# Groq analyzes the text and replies with a single label: "OFF_TOPIC".
# The Python script catches this label, blocks the query, and instantly returns: 
# "I am a corporate assistant for HR, Finance, and IT queries. I cannot answer off-topic questions."

# 4. NeMo Guardrails (The Fast Dialogue Router)
# Let's imagine the user said "Hello" instead. 
# The Python Firewall (Step 3) would label it as "SAFE" and let it pass.
# The script now hands "Hello" to NeMo Guardrails.
# Because we set `embeddings_only: True`, NeMo DOES NOT call an LLM. 
# It uses the local `SentenceTransformers` model to convert "Hello" into a mathematical vector.
# It instantly searches `rails.co` and finds a perfect match for `user express greeting`.
# NeMo immediately returns your scripted response: "Hello! I am your corporate AI assistant..."

# 5. Pass-Through (Valid Business Questions)
# Now imagine the user asks: "What is the recruitment policy?"
# It passes the Python Firewall as "SAFE".
# It goes to NeMo Guardrails. The embedding model checks it against `rails.co`.
# It realizes this is NOT a greeting, help request, or goodbye.
# NeMo hits our `catch all` flow and returns the dummy string: "PASS".
# Our Python script sees "PASS", knows this is a valid business question, 
# and hands it off to your main RAG pipeline to generate a real answer!




############-------------################
# Why NeMo Guardrails Requires an Embedding Model (and Cannot Use Just an LLM):

# The Rule: You cannot delete the embedding model from config.yml. The server will crash on startup if you do.

# The "Too Much Data" Problem: In enterprise settings, rails.co files are massive. Passing thousands of rules into an LLM prompt for every single user message would exceed context limits, cost too much money, and run very slowly.

# The RAG Architecture Solution: NeMo Guardrails solves this by hard-coding a two-step Retrieval-Augmented Generation (RAG) process:

# Startup (Indexing): entire rails.co file into a highly efficient, searchable database.
# Fast Retrieval: When a user sends a message, The embedding model mathematically compresses the the embedding model instantly searches that database to find the top 5 most relevant rules.
# LLM Decision: Only those 5 rules are passed into the Groq LLM prompt, keeping the LLM fast, cheap, and perfectly accurate.
# Conclusion: The embedding model acts as the mandatory "fast search engine," and the LLM acts as the "smart judge." You cannot have the judge without the search engine bringing them the evidence first!
