version: '3.8'

services:
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Map local DBs and Logs into the container so they aren't erased on restart
      - ./app/agents/long_term_memory.db:/app/app/agents/long_term_memory.db
      - ./app/rag/qdrant_db:/app/app/rag/qdrant_db
      - ./logs:/app/logs
    networks:
      - ai-firewall-net

  frontend:
    build: .
    command: streamlit run dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8000/query
    volumes:
      # Map chats to keep UI history permanent
      - ./dashboard/chats.json:/app/dashboard/chats.json
      - ./logs:/app/logs
    depends_on:
      - backend
    networks:
      - ai-firewall-net

networks:
  ai-firewall-net:
    driver: bridge
